<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Lazer — İndir / Download</title>
<meta name="description" content="Neon Lazer: Ayna Bulmacası — Android ve iPhone için ücretsiz indir. / Neon Laser: Mirror Puzzle — free on Android and iPhone.">
<meta property="og:title" content="Neon Lazer: Ayna Bulmacası">
<meta property="og:description" content="Aynaları çevir, lazeri hedefe ulaştır! Android ve iPhone için ücretsiz.">
<meta property="og:image" content="https://halilibrahimbalci.github.io/neonlaser/icon.png">
<link rel="icon" href="icon.png">
<script>
  // One link for everyone: phones go straight to their own store.
  (function () {
    var PLAY = "https://play.google.com/store/apps/details?id=com.halilibrahim.neonlaser";
    var APPLE = "https://apps.apple.com/app/id6835131053";
    var ua = navigator.userAgent || "";
    // iPadOS reports itself as a Mac, but has a touch screen.
    var isApple = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    var isAndroid = /Android/i.test(ua);
    if (location.search.indexOf("stay") === -1) {
      if (isApple) location.replace(APPLE);
      else if (isAndroid) location.replace(PLAY);
    }
  })();
</script>
<style>
  :root { --bg:#0a0b14; --panel:#141629; --text:#e8f0ff; --dim:#8b93b8; --cyan:#00e5ff; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background: var(--bg) radial-gradient(circle at 50% 30%, #1b2050 0%, var(--bg) 70%);
         color:var(--text); font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; padding:24px 16px; }
  main { max-width:420px; width:100%; text-align:center; }
  img.icon { width:112px; height:112px; border-radius:26px; box-shadow:0 0 40px rgba(0,229,255,.35); }
  h1 { font-size:28px; margin:20px 0 4px; color:var(--cyan); text-shadow:0 0 18px rgba(0,229,255,.6); letter-spacing:1px; }
  p.tag { color:var(--dim); margin:0 0 28px; }
  a.store { display:flex; align-items:center; justify-content:center; gap:10px; margin:12px 0; padding:16px;
            border-radius:16px; text-decoration:none; font-weight:700; font-size:18px; }
  a.play { background:var(--cyan); color:var(--bg); }
  a.apple { border:2px solid var(--cyan); color:var(--cyan); }
  a.store svg { width:22px; height:22px; fill:currentColor; }
  .qr { margin-top:28px; background:var(--panel); border-radius:20px; padding:18px; }
  .qr img { width:180px; height:180px; background:#fff; padding:10px; border-radius:12px; }
  .qr p { color:var(--dim); font-size:14px; margin:10px 0 0; }
  footer { margin-top:24px; font-size:13px; }
  footer a { color:var(--dim); }
</style>
</head>
<body>
<main>
  <img class="icon" src="icon.png" alt="Neon Lazer">
  <h1 id="title">Neon Lazer</h1>
  <p class="tag" id="tag">Aynaları çevir, lazeri hedefe ulaştır!</p>

  <a class="store play" href="https://play.google.com/store/apps/details?id=com.halilibrahim.neonlaser">
    <svg viewBox="0 0 24 24"><path d="M3.6 2.3 13.4 12l-9.8 9.7c-.3-.2-.5-.6-.5-1V3.3c0-.4.2-.8.5-1Zm11 8.5 2.7-2.7L5.3 1.5l9.3 9.3Zm0 2.4-9.3 9.3 12-6.6-2.7-2.7Zm4.1-4.3-3 3 3 3 3.4-1.9c.9-.5.9-1.8 0-2.3L18.7 8.9Z"/></svg>
    <span id="play">Google Play'den indir</span>
  </a>
  <a class="store apple" href="https://apps.apple.com/app/id6835131053">
    <svg viewBox="0 0 24 24"><path d="M16.4 12.6c0-2.4 2-3.6 2.1-3.7-1.1-1.7-2.9-1.9-3.5-1.9-1.5-.2-2.9.9-3.7.9-.8 0-1.9-.9-3.2-.8-1.6 0-3.1 1-4 2.4-1.7 3-.4 7.4 1.2 9.8.8 1.2 1.8 2.5 3 2.4 1.2 0 1.7-.8 3.2-.8s1.9.8 3.2.8c1.3 0 2.2-1.2 3-2.4.9-1.4 1.3-2.7 1.3-2.8-.1 0-2.6-1-2.6-3.9ZM14 5.4c.7-.8 1.1-1.9 1-3-1 0-2.1.7-2.8 1.5-.6.7-1.2 1.8-1 2.9 1 .1 2.1-.6 2.8-1.4Z"/></svg>
    <span id="apple">App Store'dan indir</span>
  </a>

  <div class="qr">
    <img src="qr.png" alt="QR">
    <p id="qrtext">Telefonunun kamerasıyla okut</p>
  </div>

  <footer><a href="privacy-policy.html" id="privacy">Gizlilik politikası</a></footer>
</main>
<script>
  // English for visitors whose browser isn't Turkish.
  if (!/^tr/i.test(navigator.language || "")) {
    document.documentElement.lang = "en";
    document.getElementById("title").textContent = "Neon Laser";
    document.getElementById("tag").textContent = "Turn mirrors, guide the laser to its target!";
    document.getElementById("play").textContent = "Get it on Google Play";
    document.getElementById("apple").textContent = "Download on the App Store";
    document.getElementById("qrtext").textContent = "Scan with your phone camera";
    document.getElementById("privacy").textContent = "Privacy policy";
  }
</script>
</body>
</html>
